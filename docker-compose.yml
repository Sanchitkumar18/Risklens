# ── RiskLens local orchestration ────────────────────────────
# Services: postgres (data store) + api (FastAPI) + dashboard (Streamlit).
# Bring up with:  docker compose up --build
# The API entrypoint waits for Postgres, runs migrations, and (SEED_ON_START=true)
# loads synthetic data + a demo 'Tech Growth' portfolio on first boot.
services:
  postgres:
    image: postgres:16-alpine
    container_name: risklens-postgres
    environment:
      POSTGRES_USER: risklens
      POSTGRES_PASSWORD: risklens
      POSTGRES_DB: risklens
    ports:
      - "5432:5432"
    volumes:
      - risklens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risklens -d risklens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: risklens-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://risklens:risklens@postgres:5432/risklens
      APP_ENV: development
      LOG_LEVEL: INFO
      LLM_PROVIDER: mock          # runs without an API key; set to 'openai' + key to use a real model
      SEED_ON_START: "true"       # load synthetic data + demo portfolio on first boot
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: risklens-dashboard
    depends_on:
      api:
        condition: service_healthy
    environment:
      RISKLENS_API_URL: http://api:8000/api/v1
    ports:
      - "8501:8501"

volumes:
  risklens_pgdata:
